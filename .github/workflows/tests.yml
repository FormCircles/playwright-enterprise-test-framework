name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Notify Pumble - CI started
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.PUMBLE_CI_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"🚀 CI started | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Workflow: ${{ github.workflow }} | Commit: ${{ github.sha }}\"}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r sut/FastAPIMockApp/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      
      - name: Verify Playwright installation
        run: |
          python -m playwright --version
          python -m playwright install --list

      - name: Build FastAPI Docker image
        run: |
          docker build -t fastapi-mock-enterprise-app:ci ./sut/FastAPIMockApp

      - name: Start FastAPI app
        run: |
          cd sut/FastAPIMockApp
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8080 > server.log 2>&1 &
          echo $! > uvicorn.pid

      - name: Wait for API readiness
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import sys

          urls = [
              "http://127.0.0.1:8080/health",
              "http://127.0.0.1:8080/docs"
          ]

          timeout_seconds = 60
          interval_seconds = 2
          deadline = time.time() + timeout_seconds

          while time.time() < deadline:
              for url in urls:
                  try:
                      with urllib.request.urlopen(url) as response:
                          if response.status == 200:
                              print(f"Service is ready via {url}")
                              sys.exit(0)
                  except Exception:
                      pass
              print("Waiting for API...")
              time.sleep(interval_seconds)

          raise SystemExit("FastAPI service failed to become ready within timeout.")
          PY

      - name: Verify API is running
        run: |
          curl -f http://127.0.0.1:8080/docs

      - name: Run smoke tests
        run: |
          mkdir -p test-results
          python -m pytest -v -m smoke --env=ci \
            --junitxml=test-results/junit-results.xml \
            --html=test-results/report.html \
            --self-contained-html

      # Future regression execution
      # - name: Run regression tests
      #   run: |
      #     python -m pytest -v -m regression --env=dev

      # Regression suite intentionally deferred.
      # Future enhancement:
      # - nightly execution
      # - scheduled workflow
      # - full validation suite

      - name: Print server logs
        if: ${{ always() }}
        run: |
          cat sut/FastAPIMockApp/server.log || echo "No server.log found"

      - name: Collect canonical PETF artifacts
        id: collect_artifacts
        if: ${{ !cancelled() }}
        run: |
          python -m scripts.collect_ci_artifacts \
            --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload canonical PETF artifacts
        if: ${{ always() && !cancelled() && steps.collect_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: petf-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.collect_artifacts.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Stop FastAPI app
        if: ${{ always() }}
        run: |
          if [ -f sut/FastAPIMockApp/uvicorn.pid ]; then
            kill $(cat sut/FastAPIMockApp/uvicorn.pid) || true
          fi

      - name: Notify Pumble - CI finished
        if: always()
        continue-on-error: true
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.PUMBLE_CI_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"🏁 CI finished | Result: ${STATUS} | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: ${RUN_URL}\"}"