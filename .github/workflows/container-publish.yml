name: Build Test Publish Container

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: fc-fastapi-sut

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Notify Pumble - CI started
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.PUMBLE_CI_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d "{\"text\":\"🚀 CI started | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Workflow: ${{ github.workflow }} | Commit: ${{ github.sha }}\"}"

      - name: Normalize image owner
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image tags
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_SHA=${REGISTRY}/${OWNER_LC}/${IMAGE_REPO}:${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_LATEST=${REGISTRY}/${OWNER_LC}/${IMAGE_REPO}:latest" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_SHA \
            -t $IMAGE_LATEST \
            ./sut/FastAPIMockApp

      - name: Start containerized app
        run: |
          docker run -d \
            --name fc-fastapi-sut \
            -p 8080:8080 \
            $IMAGE_SHA

      - name: Wait for app health
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8080/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done

          echo "App failed to become healthy"
          docker logs fc-fastapi-sut > /tmp/petf-health.log 2>&1 || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run automated tests
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          pytest api_tests/tests \
            --env=ci \
            --junitxml=test-results/junit-results.xml \
            --html=test-results/report.html \
            --self-contained-html

      - name: Display verified container diagnostics
        if: ${{ always() && !cancelled() }}
        run: |
          for log in /tmp/petf-startup.log /tmp/petf-health.log /tmp/petf-failure.log; do
            if [ -f "$log" ]; then
              python -m scripts.safe_console_log "$log" || true
            fi
          done

      - name: Collect and verify PETF artifacts
        id: collect_artifacts
        if: ${{ always() && !cancelled() }}
        run: |
          python -m scripts.collect_ci_artifacts \
            --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload verified PETF artifacts
        if: ${{ always() && !cancelled() && steps.collect_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.collect_artifacts.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.collect_artifacts.outcome == 'success' }}
        run: |
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs fc-fastapi-sut > /tmp/petf-failure.log 2>&1 || true
          python -m scripts.safe_console_log /tmp/petf-failure.log || true

      - name: Notify Pumble - CI finished
        if: always()
        continue-on-error: true
        run: |
          STATUS="${{ job.status }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.PUMBLE_CI_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"🏁 CI finished | Result: ${STATUS} | Repo: ${{ github.repository }} | Branch: ${{ github.ref_name }} | Run: ${RUN_URL}\"}"